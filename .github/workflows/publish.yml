name: Publish to Release and PyPI

on:
  push:
    tags: [v*]

jobs:
  build:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3

      - name: Build
        run: |
          python -m pip install --upgrade build pip setuptools wheel
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish-to-release:
    name: Publish to Release
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          name: Hikvision-OpenAPI-Signer ${{ github.ref }}
          files: dist/*

  publish-to-pypi:
    name: Publish to PyPI
    permissions:
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
